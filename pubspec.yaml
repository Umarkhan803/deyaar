name: deyaar_constructions
description: Offline construction management app for Deyaar Constructions.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  crypto: ^3.0.6
  intl: ^0.20.2
  image_picker: ^1.1.2
  pdf: ^3.11.3
  printing: ^5.14.2
  google_fonts: ^6.2.1
  fl_chart: ^1.2.0
  local_auth: ^3.0.2
  local_auth_android: ^2.0.9
  local_auth_darwin: ^2.0.3
  csv: ^8.0.0
  video_player: ^2.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
    - assets/brand/logo_full.jpg
    - assets/brand/logo.jpeg
